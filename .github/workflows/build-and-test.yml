name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        node-version: '24'
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    - name: Restore dependencies
      run: dotnet restore Nuevo_Sistema.sln
    
    - name: Build solution
      run: dotnet build Nuevo_Sistema.sln --configuration Release --no-restore
    
    - name: Build solution (Debug with warnings as errors)
      run: dotnet build Nuevo_Sistema.sln --configuration Debug --no-restore --warnaserror
    
    - name: Check for test projects
      id: check-tests
      shell: powershell
      run: |
        $testProjects = Get-ChildItem -Path tests -Filter "*.csproj" -Recurse -ErrorAction SilentlyContinue
        if ($testProjects) {
          Write-Host "Test projects found: $($testProjects.Count)"
          echo "has_tests=true" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "No test projects found - skipping test execution"
          echo "has_tests=false" >> $env:GITHUB_OUTPUT
        }

    - name: Run tests
      if: steps.check-tests.outputs.has_tests == 'true'
      run: dotnet test tests/**/*.csproj --configuration Release --no-build --verbosity normal

    - name: Skip tests notification
      if: steps.check-tests.outputs.has_tests == 'false'
      run: echo "No test projects configured. Test execution skipped."
    
    - name: Check for compilation warnings
      shell: powershell
      run: |
        $buildOutput = dotnet build Nuevo_Sistema.sln --configuration Debug --no-restore 2>&1
        $hasCSWarnings = $buildOutput -match "warning CS"
        if ($hasCSWarnings) {
          Write-Error "Build completed with CS warnings. For ISO audit compliance, builds must have zero CS warnings."
          Write-Host $buildOutput
          exit 1
        }
        $hasAdvertencias = $buildOutput -match "warning"
        if ($hasAdvertencias) {
          Write-Host "Build completed with suppressed warnings (IL/CA analysis warnings - expected)."
          Write-Host "These are intentionally suppressed in .csproj files for AOT/trimming compatibility."
          Write-Host "No CS (C# compiler) warnings detected - ISO audit compliant."
        } else {
          Write-Host "Build completed successfully with zero warnings."
        }
